[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "keyper"
version = "0.3.0"
description = "Auditable keyboard-channel file transfer for approved Wayland RDP sessions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Keyper contributors" }]
keywords = ["rdp", "wayland", "remmina", "ydotool", "powershell"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/GeekyVed/keyper"
Repository = "https://github.com/GeekyVed/keyper.git"
Issues = "https://github.com/GeekyVed/keyper/issues"

[project.scripts]
keyper = "keyper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
